name: Prévia iOS ARMv7

on:
  workflow_dispatch:
  push:
    branches: [downloads/central-0.4.20]
    paths:
      - .github/workflows/ios-preview.yml
      - scripts/build-ios.sh
      - scripts/verify-ios-armv7.py
      - app/**
      - src/**
      - packaging/**
      - config/**

permissions:
  contents: read

concurrency: ios-preview

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Testar o serviço no Linux
        run: make test
      - name: Instalar toolchain e SDK legado
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libtinfo5 libxml2
          mkdir -p "$RUNNER_TEMP/ios-toolchain" "$RUNNER_TEMP/ios-sdk"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/L1ghtmann/llvm-project/releases/download/test-210562a/iOSToolchain-x86_64.tar.xz \
            -o "$RUNNER_TEMP/ios-toolchain.tar.xz"
          tar -xJf "$RUNNER_TEMP/ios-toolchain.tar.xz" -C "$RUNNER_TEMP/ios-toolchain"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS9.3.sdk.tar.xz \
            -o "$RUNNER_TEMP/ios-sdk.tar.xz"
          tar -xJf "$RUNNER_TEMP/ios-sdk.tar.xz" -C "$RUNNER_TEMP/ios-sdk"
          bin="$RUNNER_TEMP/ios-toolchain/linux/iphone/bin"
          linker="$(find "$bin" -maxdepth 1 \( -name '*-apple-darwin*-ld' -o -name ld \) -print -quit)"
          test -x "$linker"
          test -x "$bin/clang"
          test -x "$bin/ldid"
          sdk="$(find "$RUNNER_TEMP/ios-sdk" -type d -name iPhoneOS9.3.sdk -print -quit)"
          test -d "$sdk"
          # The split Theos stub is missing an ARMv7 re-export. Use the
          # complete device symbol stub from the matching 9.3 SDK.
          curl --fail --silent --show-error --location --retry 3 \
            https://raw.githubusercontent.com/mstg/iOS-full-sdk/9c6f907ff1a9dc7a2e6efbd11369d9c1a2cf306e/iPhoneOS9.3.sdk/usr/lib/libSystem.tbd \
            -o "$sdk/usr/lib/libSystem.tbd"
          printf '%s\n' "$bin" >> "$GITHUB_PATH"
          {
            printf 'IOS_CLANG=%s\n' "$bin/clang"
            printf 'IOS_LINKER=%s\n' "$linker"
            printf 'IOS_SDK=%s\n' "$sdk"
            printf 'LDID=%s\n' "$bin/ldid"
            printf 'LD_LIBRARY_PATH=%s\n' "$bin/../lib"
          } >> "$GITHUB_ENV"
      - name: Compilar e verificar os pacotes
        shell: bash
        run: |
          make ios
          python3 scripts/verify-ios-armv7.py dist/*.deb
          (cd dist && sha256sum *.deb > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: dnsblock-ios-armv7
          path: dist/*
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/downloads/central-0.4.20'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dnsblock-ios-armv7
          path: dist
      - name: Publicar prévia experimental
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS.txt)
          version="$(dpkg-deb -f dist/*.deb Version)"
          tag="v$version-ios.1"
          package="dnsblock-central-$version.deb"
          if gh release view "$tag" --json assets,isDraft > "$RUNNER_TEMP/ios-release.json" 2>/dev/null; then
            jq -e --arg package "$package" '.isDraft == false and ([.assets[].name] | sort) == ["SHA256SUMS.txt", $package]' "$RUNNER_TEMP/ios-release.json"
            exit
          fi
          cat > "$RUNNER_TEMP/ios-notes.md" <<'NOTES'
          Pacote único para ARMv7, com iOS 8.0 como mínimo. Inclui o painel Central da Casa e o serviço DNSBlock.
          Instale o .deb no Filza com o jailbreak ativo e abra Central da Casa. O botão Bloqueio alterna o filtro enquanto o DNS continua respondendo.
          Aprimora a localização usada no clima, corrige a leitura de céu predominantemente limpo e mostra sensação térmica, nuvens e precisão da localização. A localização ainda precisa ser testada no iPad.
          NOTES
          gh release create "$tag" "dist/$package" dist/SHA256SUMS.txt \
            --target "457e704447133b52b7e8c8eb2d687b79bb99d676" --prerelease --latest=false --title "DNSBlock Legacy $version — Central da Casa" \
            --notes-file "$RUNNER_TEMP/ios-notes.md"
